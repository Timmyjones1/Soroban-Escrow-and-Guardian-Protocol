name: Security Audit

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 0 * * 1' # Weekly security audit

jobs:
  audit:
    name: Cargo Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit prebuilt binary
        uses: taiki-e/install-action@cargo-audit
      - name: Run Cargo Audit
        run: cargo audit --ignore RUSTSEC-2026-0387 --ignore RUSTSEC-2024-0436 --ignore RUSTSEC-2020-0071 --ignore RUSTSEC-2020-0159
