name: Security Audit

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 0 * * 1' # Weekly security audit

jobs:
  audit:
    name: Cargo Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
