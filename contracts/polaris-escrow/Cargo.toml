[package]
name = "polaris-escrow"
version = "0.1.0"
edition = "2021"
description = "Stellar PolarisPay Soroban milestone escrow and programmable disbursement contract"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
