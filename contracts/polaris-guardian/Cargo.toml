[package]
name = "polaris-guardian"
version = "0.1.0"
edition = "2021"
description = "Stellar PolarisPay Guardian On-Chain Breach and Dispute Registry with Keeper Incentives"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
